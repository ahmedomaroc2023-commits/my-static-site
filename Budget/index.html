  <style>
    :root{--ink:#182033;--muted:#71809b;--line:#e8ebf3;--paper:#fff;--canvas:#f5f6fb;--brand:#5b4bdb;--brand2:#8c7bff;--soft:#efedff;--danger:#e25268;--shadow:0 18px 50px rgba(41,32,93,.10)}
    *{box-sizing:border-box} body{margin:0;background:var(--canvas);font-family:Tahoma,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh} button,input,textarea,select{font:inherit} button{cursor:pointer} .shell{max-width:1180px;margin:auto;padding:26px 24px 50px}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.mark{height:44px;width:44px;border-radius:15px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-size:23px;box-shadow:0 10px 22px #6c5bea55}.brand h1{font-size:1.18rem;margin:0}.brand p{font-size:.78rem;color:var(--muted);margin:4px 0 0}.actions{display:flex;gap:9px;align-items:center}.icon-btn,.language{border:1px solid var(--line);background:#fff;color:var(--ink);height:40px;border-radius:12px;padding:0 13px}.icon-btn{font-size:18px}.primary{border:0;border-radius:13px;background:var(--brand);color:#fff;padding:12px 17px;font-weight:700;box-shadow:0 8px 18px #5b4bdb35}
    .dashboard{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(300px,.72fr);gap:22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.calendar{padding:24px}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.month-title{font-size:1.25rem;margin:0}.nav{display:flex;gap:7px}.nav button{width:35px;height:35px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:19px;color:var(--muted)}.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekdays{text-align:center;color:var(--muted);font-size:.74rem;font-weight:700;margin-bottom:9px}.day{border:0;background:transparent;min-height:78px;border-radius:14px;text-align:start;padding:9px;position:relative;color:var(--ink);transition:.15s}.day:hover{background:var(--soft)}.day.other{color:#b8c0d0}.day.today .number{background:var(--brand);color:#fff}.number{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:.83rem;font-weight:700}.dots{display:flex;gap:3px;position:absolute;bottom:10px;inset-inline-start:12px}.dot{width:5px;height:5px;border-radius:50%;background:var(--brand)}.dot:nth-child(2){background:#f5af42}.dot:nth-child(3){background:#50b694}.selected{background:var(--soft)!important;outline:1px solid #d9d5ff}
    aside{padding:22px}.today-head{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:17px}.today-head h2{font-size:1rem;margin:0}.today-head span{color:var(--muted);font-size:.77rem;margin-top:5px;display:block}.count{background:var(--soft);color:var(--brand);padding:6px 9px;border-radius:9px;font-size:.75rem;font-weight:700}.task-list{display:flex;flex-direction:column;gap:10px;margin:17px 0}.task{padding:13px;border:1px solid var(--line);border-radius:14px;display:flex;gap:11px;align-items:flex-start}.task.done{opacity:.58}.task.done .task-name{text-decoration:line-through}.check{appearance:none;min-width:19px;height:19px;border:2px solid #cdd2df;border-radius:6px;margin:2px 0 0;background:#fff}.check:checked{background:var(--brand);border-color:var(--brand)}.task-body{min-width:0;flex:1}.task-name{font-size:.87rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task-time{font-size:.75rem;color:var(--muted);margin-top:5px}.task-time strong{color:var(--brand);margin-inline-end:6px}.empty{text-align:center;color:var(--muted);font-size:.85rem;padding:30px 10px}.empty b{display:block;font-size:1.8rem;margin-bottom:8px}.agenda-label{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:25px 0 10px}.agenda{padding:0 24px 24px}.agenda-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.agenda-date{width:43px;text-align:center;color:var(--brand);font-size:.76rem;font-weight:700}.agenda-date b{display:block;font-size:1.15rem}.agenda-title{font-weight:700;font-size:.9rem}.agenda-meta{font-size:.74rem;color:var(--muted);margin-top:4px}.tag{margin-inline-start:auto;background:#f5f6fb;color:var(--muted);border-radius:8px;padding:5px 7px;font-size:.68rem}
    dialog{border:0;border-radius:22px;padding:0;max-width:480px;width:calc(100% - 28px);box-shadow:0 28px 80px #1b174b44}dialog::backdrop{background:#15122a70}.modal{padding:25px}.modal h2{margin:0 0 20px;font-size:1.15rem}.field{display:block;font-size:.78rem;font-weight:700;margin:14px 0 6px}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;outline:none;background:#fff}.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:11px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:23px}.cancel{border:0;background:#f2f3f8;border-radius:11px;padding:11px 15px;color:var(--ink)}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(100px);background:#1d2540;color:#fff;padding:12px 16px;border-radius:12px;font-size:.84rem;box-shadow:var(--shadow);transition:.25s;z-index:3}.toast.show{transform:translateX(-50%) translateY(0)}
    @media(max-width:800px){.dashboard{grid-template-columns:1fr}.day{min-height:60px}.shell{padding:18px 14px}.calendar{padding:16px}.agenda{padding:0 16px 16px}}@media(max-width:480px){header{align-items:flex-start}.brand p{display:none}.primary{font-size:0;width:42px;padding:0}.primary::before{content:'+';font-size:23px}.day{padding:5px;min-height:51px}.dots{bottom:7px;inset-inline-start:8px}.weekdays{font-size:.64rem;gap:2px}.days{gap:2px}.actions{gap:5px}.language{padding:0 8px}}
    /* Product dashboard refresh */
    body{background:linear-gradient(135deg,#f8f9ff 0%,#eef0fa 55%,#f7f6ff 100%);font-family:"Segoe UI",Tahoma,sans-serif}.shell{max-width:1240px;padding-top:34px}.brand .mark{width:48px;height:48px;border-radius:16px;transform:rotate(-5deg)}.brand .mark::after{content:'✦';font-size:16px;position:absolute;margin:27px 0 0 26px}.brand h1{font-size:1.28rem;letter-spacing:-.02em}.actions{background:#fff;padding:5px;border:1px solid #e5e8f2;border-radius:16px;box-shadow:0 7px 20px #1e276708}.language,.icon-btn{border:0;background:#f6f7fb;border-radius:10px}.primary{background:linear-gradient(135deg,#5b4bdb,#7664ef);border-radius:12px;letter-spacing:.01em}.hero{position:relative;overflow:hidden;border-radius:25px;margin:0 0 22px;padding:27px 30px;background:linear-gradient(112deg,#24244e 0%,#3a3183 55%,#6254d1 100%);color:#fff;box-shadow:0 20px 48px #39307635}.hero::after{content:'';position:absolute;width:280px;height:280px;border:50%;background:#a498ff33;inset-inline-end:-70px;top:-145px;box-shadow:-40px 110px 0 #ffffff0b}.hero-grid{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:25px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-weight:700;font-size:.7rem;color:#c4bfff}.hero h2{font-size:1.62rem;letter-spacing:-.04em;margin:8px 0}.hero p{margin:0;color:#dedbff;font-size:.9rem}.metrics{display:flex;gap:10px}.metric{min-width:108px;padding:13px 15px;border-radius:14px;background:#ffffff16;border:1px solid #ffffff25;backdrop-filter:blur(8px)}.metric b{font-size:1.22rem;display:block}.metric span{font-size:.7rem;color:#dedbff}.dashboard{grid-template-columns:minmax(0,1.5fr) minmax(310px,.7fr)}.card{border:0;box-shadow:0 16px 45px #2832610c;border-radius:24px}.calendar{padding:26px}.calendar-head{padding-bottom:17px;border-bottom:1px solid var(--line)}.month-title{font-size:1.4rem}.nav button{background:#f4f3ff;border:0;color:var(--brand);font-weight:700}.weekdays{padding:10px 3px 2px}.day{min-height:88px;border:1px solid transparent;background:#fbfbfe}.day:hover{transform:translateY(-2px);box-shadow:0 8px 16px #24306c0b}.day.selected{background:#f0efff!important;outline:1px solid #ccc6ff}.day.today .number{box-shadow:0 4px 9px #5b4bdb55}.dots{gap:4px}.dot{width:6px;height:6px}.today-head{border-bottom:0;background:linear-gradient(135deg,#f1f0ff,#fbfaff);margin:-22px -22px 12px;padding:22px;border-radius:24px 24px 18px 18px}.count{background:#fff;color:var(--brand);box-shadow:0 5px 14px #5440bd14}.task{border:0;background:#fafbfe;padding:14px;border-radius:15px;transition:.16s}.task:hover{background:#f2f1ff;transform:translateX(-2px)}.check{border-radius:50%;border-width:1.5px}.task-time strong{display:inline-flex;background:#e9e7ff;padding:3px 6px;border-radius:6px;font-size:.67rem}.agenda{padding:2px 27px 17px}.agenda-label{padding-top:19px}.agenda-item{padding:16px 0}.agenda-date{background:#f0efff;border-radius:12px;padding:5px;width:46px}.tag{background:#f1f2f8}.dialog{}dialog{border-radius:25px}.modal{padding:28px}.field{color:#4b5773}.input{background:#f8f9fd;border:0;padding:13px}.input:focus{background:#fff}.priority{display:flex;gap:7px;margin-top:8px}.priority label{flex:1;cursor:pointer}.priority input{position:absolute;opacity:0}.priority span{display:block;text-align:center;padding:9px 4px;border-radius:10px;background:#f5f6fa;color:#6c7790;font-size:.74rem}.priority input:checked+span{background:#eae7ff;color:#5240ce;font-weight:700}@media(max-width:650px){.hero{padding:22px}.hero-grid{display:block}.metrics{margin-top:20px}.metric{flex:1;min-width:0}.day{min-height:64px}.calendar{padding:15px}.today-head{margin:-22px -22px 12px}}
  </style>
</head>
<body>
<main class="shell">
 <header><div class="brand"><div class="mark">✓</div><div><h1 data-i18n="app">Mon Agenda</h1><p data-i18n="subtitle">Vos journées, clairement organisées</p></div></div><div class="actions"><select class="language" id="language" aria-label="Language"><option value="ar">العربية</option><option value="fr">Français</option></select><button class="icon-btn" id="notify" title="Notifications">♧</button><button class="primary" id="add" data-i18n="newTask">Nouvelle tâche</button></div></header>
 <section class="hero"><div class="hero-grid"><div><div class="eyebrow" data-i18n="focus">Focus du jour</div><h2 id="heroTitle">Planifiez votre journée</h2><p id="heroText">Chaque petite étape compte.</p></div><div class="metrics"><div class="metric"><b id="metricToday">0</b><span data-i18n="todayTasks">pour aujourd’hui</span></div><div class="metric"><b id="metricWeek">0</b><span data-i18n="weekTasks">cette semaine</span></div><div class="metric"><b id="metricDone">0%</b><span data-i18n="progress">progression</span></div></div></div></section>
 <section class="dashboard"><div class="card calendar"><div class="calendar-head"><div><h2 class="month-title" id="month"></h2><span id="year" style="color:var(--muted);font-size:.8rem"></span></div><div class="nav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="weekdays" id="weekdays"></div><div class="days" id="days"></div></div><aside class="card"><div class="today-head"><div><h2 id="selectedTitle"></h2><span id="selectedLabel"></span></div><b class="count" id="count">0</b></div><div class="task-list" id="tasks"></div><button class="primary" style="width:100%" id="addForDay" data-i18n="addForDay">Ajouter pour ce jour</button></aside></section>
 <section class="card" style="margin-top:22px"><div class="agenda"><div class="agenda-label" data-i18n="upcoming">À venir</div><div id="upcoming"></div></div></section>
</main>
<dialog id="dialog"><form class="modal" id="form"><h2 data-i18n="taskDetails">Détails de la tâche</h2><label class="field" data-i18n="title">Titre</label><input class="input" id="title" required maxlength="100" placeholder=""><div class="pair"><div><label class="field" data-i18n="date">Date</label><input class="input" id="date" type="date" required></div><div><label class="field" data-i18n="time">Heure</label><input class="input" id="time" type="time" required></div></div><label class="field" data-i18n="priority">Priorité</label><div class="priority"><label><input type="radio" name="priority" value="low"><span data-i18n="low">Douce</span></label><label><input type="radio" name="priority" value="normal" checked><span data-i18n="normal">Normale</span></label><label><input type="radio" name="priority" value="high"><span data-i18n="high">Importante</span></label></div><label class="field" data-i18n="notes">Notes</label><textarea class="input" id="notes" rows="3" maxlength="280"></textarea><div class="modal-actions"><button type="button" class="cancel" id="close" data-i18n="cancel">Annuler</button><button class="primary" data-i18n="save">Enregistrer</button></div></form></dialog><div class="toast" id="toast"></div>
<script>
const strings={ar:{app:'مفكرتي',subtitle:'نظّم أيامك بكل وضوح',newTask:'مهمة جديدة',addForDay:'إضافة مهمة لهذا اليوم',upcoming:'القادم',taskDetails:'تفاصيل المهمة',title:'العنوان',date:'التاريخ',time:'الوقت',notes:'ملاحظات',cancel:'إلغاء',save:'حفظ',today:'اليوم',noTasks:'لا توجد مهام لهذا اليوم',saved:'تم حفظ المهمة',completed:'تم تحديث المهمة',notificationAllowed:'تم تفعيل التنبيهات',notificationDenied:'لم يتم السماح بالتنبيهات',reminder:'تذكير بالمهام',mins:'بعد 30 دقيقة',days:['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],months:['يناير','فبراير','مارس','أبريل','ماي','يونيو','يوليوز','غشت','شتنبر','أكتوبر','نونبر','دجنبر']},fr:{app:'Mon Agenda',subtitle:'Vos journées, clairement organisées',newTask:'Nouvelle tâche',addForDay:'Ajouter pour ce jour',upcoming:'À venir',taskDetails:'Détails de la tâche',title:'Titre',date:'Date',time:'Heure',notes:'Notes',cancel:'Annuler',save:'Enregistrer',today:"Aujourd’hui",noTasks:'Aucune tâche pour cette journée',saved:'Tâche enregistrée',completed:'Tâche mise à jour',notificationAllowed:'Notifications activées',notificationDenied:'Notifications non autorisées',reminder:'Rappel de tâche',mins:'dans 30 minutes',days:['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'],months:['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre']}};
Object.assign(strings.ar,{focus:'تركيز اليوم',todayTasks:'لليوم',weekTasks:'لهذا الأسبوع',progress:'نسبة الإنجاز',priority:'الأولوية',low:'مرنة',normal:'عادية',high:'مهمة'});Object.assign(strings.fr,{focus:'Focus du jour',todayTasks:"pour aujourd’hui",weekTasks:'cette semaine',progress:'progression',priority:'Priorité',low:'Douce',normal:'Normale',high:'Importante'});
let lang=localStorage.lang||'ar',view=new Date(),selected=new Date(),db;const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,same=(a,b)=>key(a)===key(b),t=k=>strings[lang][k];
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open('budgetAgenda',1);r.onupgradeneeded=()=>r.result.createObjectStore('tasks',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>{db=r.result;ok()};r.onerror=no})}function all(){return new Promise(ok=>{let r=db.transaction('tasks').objectStore('tasks').getAll();r.onsuccess=()=>ok(r.result)})}function put(x){return new Promise(ok=>{let r=db.transaction('tasks','readwrite').objectStore('tasks').put(x);r.onsuccess=ok})}
function fmt(d){return new Intl.DateTimeFormat(lang==='ar'?'ar-MA':'fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(d)}function setLanguage(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('#language').value=lang;document.title=t('app');document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));render()}
async function render(){let tasks=await all(), y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),start=first.getDay(),last=new Date(y,m+1,0).getDate();$('#month').textContent=t('months')[m];$('#year').textContent=y;$('#weekdays').innerHTML=t('days').map(x=>`<span>${x}</span>`).join('');let cells=[];for(let i=0;i<42;i++){let n=i-start+1,d=new Date(y,m,n),inMonth=n>0&&n<=last,items=tasks.filter(x=>x.date===key(d));cells.push(`<button class="day ${inMonth?'':'other'} ${same(d,new Date())?'today':''} ${same(d,selected)?'selected':''}" data-date="${key(d)}"><span class="number">${d.getDate()}</span>${items.length?'<span class="dots">'+items.slice(0,3).map(()=>'<i class="dot"></i>').join('')+'</span>':''}</button>`)}$('#days').innerHTML=cells.join('');document.querySelectorAll('.day').forEach(e=>e.onclick=()=>{selected=new Date(e.dataset.date+'T12:00:00');render()});let daily=tasks.filter(x=>x.date===key(selected)).sort((a,b)=>a.time.localeCompare(b.time));$('#selectedTitle').textContent=same(selected,new Date())?t('today'):fmt(selected);$('#selectedLabel').textContent=fmt(selected);$('#count').textContent=daily.length;$('#tasks').innerHTML=daily.length?daily.map(x=>`<div class="task ${x.done?'done':''}"><input class="check" type="checkbox" ${x.done?'checked':''} data-id="${x.id}"><div class="task-body"><div class="task-name">${esc(x.title)}</div><div class="task-time"><strong>${x.time}</strong>${esc(x.notes||'')}</div></div></div>`).join(''):`<div class="empty"><b>◌</b>${t('noTasks')}</div>`;document.querySelectorAll('.check').forEach(e=>e.onchange=async()=>{let x=tasks.find(z=>z.id==e.dataset.id);x.done=e.target.checked;await put(x);toast(t('completed'));render()});let future=tasks.filter(x=>!x.done&&new Date(`${x.date}T${x.time}`)>=new Date()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,6);$('#upcoming').innerHTML=future.length?future.map(x=>`<div class="agenda-item"><div class="agenda-date"><b>${new Date(x.date+'T12').getDate()}</b>${t('months')[new Date(x.date+'T12').getMonth()].slice(0,3)}</div><div><div class="agenda-title">${esc(x.title)}</div><div class="agenda-meta">${x.time} · ${esc(x.notes||'')}</div></div><span class="tag">${new Date(x.date+'T12').toLocaleDateString(lang==='ar'?'ar-MA':'fr-FR',{weekday:'short'})}</span></div>`).join(''):`<div class="empty">${t('noTasks')}</div>`;schedule(tasks)}
function esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(e.timer);e.timer=setTimeout(()=>e.classList.remove('show'),2800)}let timers=[];function schedule(tasks){dashboardStats(tasks);timers.forEach(clearTimeout);timers=[];if(Notification.permission!=='granted')return;tasks.filter(x=>!x.done).forEach(x=>{let ms=new Date(`${x.date}T${x.time}`).getTime()-Date.now()-1800000;if(ms>0&&ms<2147483647)timers.push(setTimeout(()=>new Notification(t('reminder'),{body:`${x.title} — ${t('mins')}`}),ms))})}
function dashboardStats(tasks){let now=new Date(),weekEnd=new Date(now);weekEnd.setDate(now.getDate()+6);let today=tasks.filter(x=>x.date===key(now)&&!x.done).length,week=tasks.filter(x=>{let d=new Date(x.date+'T12:00');return !x.done&&d>=new Date(now.getFullYear(),now.getMonth(),now.getDate())&&d<=weekEnd}).length,done=tasks.length?Math.round(tasks.filter(x=>x.done).length/tasks.length*100):0;$('#metricToday').textContent=today;$('#metricWeek').textContent=week;$('#metricDone').textContent=done+'%';$('#heroTitle').textContent=lang==='ar'?(today?'لديك خطوات جميلة اليوم':'مساحة هادئة ليومك القادم'):(today?'Une journée à votre rythme':'Une page blanche pour commencer');$('#heroText').textContent=lang==='ar'?(today?'ركّز على المهمة التالية، واترك لنا التنظيم.':'أضف أول مهمة وابدأ ببساطة.'):(today?'Concentrez-vous sur la prochaine étape.':'Ajoutez une première tâche, simplement.')}
function openTask(){ $('#date').value=key(selected);$('#time').value='09:00';$('#title').value='';$('#notes').value='';document.querySelector('input[name="priority"][value="normal"]').checked=true;$('#dialog').showModal();$('#title').focus()}$('#add').onclick=openTask;$('#addForDay').onclick=openTask;$('#close').onclick=()=>$('#dialog').close();$('#prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('#next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('#language').onchange=e=>{lang=e.target.value;localStorage.lang=lang;setLanguage()};$('#notify').onclick=async()=>{let p=await Notification.requestPermission();toast(p==='granted'?t('notificationAllowed'):t('notificationDenied'));render()};$('#form').onsubmit=async e=>{e.preventDefault();await put({title:$('#title').value.trim(),date:$('#date').value,time:$('#time').value,priority:document.querySelector('input[name="priority"]:checked').value,notes:$('#notes').value.trim(),done:false});$('#dialog').close();toast(t('saved'));render()};
openDB().then(()=>{setLanguage();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')});
</script></body></html>
