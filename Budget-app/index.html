<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>ميزانيتي | Mon Budget</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #0f1729; --ink-2: #1e293b; --ink-3: #475569; --ink-4: #64748b; --ink-5: #94a3b8;
  --accent: #5b4fe9; --accent-2: #4f46e5; --accent-3: #7c3aed; --accent-soft: #eef2ff;
  --green: #059669; --green-soft: #ecfdf5;
  --red: #dc2626; --red-soft: #fef2f2;
  --amber: #d97706; --amber-soft: #fffbeb;
  --bg: #f5f6f9; --card: #ffffff; --card-2: #fafbfc;
  --line: #eef0f4; --line-2: #e2e5ea;
  --shadow-xs: 0 1px 2px rgba(15,23,42,.04);
  --shadow-sm: 0 2px 8px -2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.03);
  --shadow-md: 0 12px 32px -8px rgba(15,23,42,.08), 0 4px 12px -4px rgba(15,23,42,.04);
  --shadow-hero: 0 22px 48px -16px rgba(79,70,229,.45);
  --shadow-fab: 0 16px 32px -8px rgba(79,70,229,.55), 0 6px 14px -2px rgba(79,70,229,.35);
}

[data-theme="dark"] {
  --ink: #f8fafc; --ink-2: #e2e8f0; --ink-3: #cbd5e1; --ink-4: #94a3b8; --ink-5: #64748b;
  --accent: #8b7ff5; --accent-2: #7c6ef0; --accent-3: #a78bfa; --accent-soft: #2d2a5e;
  --green: #34d399; --green-soft: #064e3b;
  --red: #f87171; --red-soft: #7f1d1d;
  --amber: #fbbf24; --amber-soft: #78350f;
  --bg: #0a0e1e; --card: #161d33; --card-2: #1e2641;
  --line: #232c48; --line-2: #2f3a58;
  --shadow-xs: 0 1px 2px rgba(0,0,0,.3);
  --shadow-sm: 0 2px 8px -2px rgba(0,0,0,.4);
  --shadow-md: 0 12px 32px -8px rgba(0,0,0,.5);
  --shadow-hero: 0 22px 48px -16px rgba(99,102,241,.4);
  --shadow-fab: 0 16px 32px -8px rgba(99,102,241,.55);
}

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: 'Cairo', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--ink);
  min-height: 100vh; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  transition: background .3s ease, color .3s ease;
  padding-bottom: 100px; font-weight: 500;
}
html[dir="ltr"] body { font-family: 'Plus Jakarta Sans', 'Cairo', system-ui, sans-serif; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; }
a { color: inherit; text-decoration: none; }

.num, .hero-amount, .stat-pill-value, .tx-amount, .budget-figures, .budget-pct, .donut-value, .legend-value {
  direction: ltr; unicode-bidi: isolate;
}

.app { max-width: 480px; margin: 0 auto; padding: 0 20px; }
@media (max-width: 400px) { .app { padding: 0 16px; } }

/* ═══ HEADER ═══ */
.app-header {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  margin: 0 -20px; padding: 0 20px;
  transition: background .3s ease;
}
@media (max-width: 400px) { .app-header { margin: 0 -16px; padding: 0 16px; } }

.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 0 12px;
}

.month-nav-group {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1;
  min-width: 0;
}

.month-arrow {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--card);
  color: var(--ink-4);
  border: 1px solid var(--line);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: .85rem;
  cursor: pointer;
  transition: all .2s ease;
  flex-shrink: 0;
}
.month-arrow:hover { color: var(--accent); border-color: var(--accent); }
.month-arrow:active { transform: scale(.92); }

.month-label {
  flex: 1;
  min-width: 0;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 10px;
  transition: background .2s;
  text-align: center;
  user-select: none;
}
.month-label:active { background: var(--card-2); }

.month-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -.015em;
  line-height: 1.15;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.month-year {
  font-size: .7rem;
  color: var(--ink-4);
  font-weight: 600;
  letter-spacing: .02em;
  margin-top: 2px;
}
.month-sub {
  font-size: .66rem;
  color: var(--ink-5);
  font-weight: 600;
  margin-top: 1px;
}

.header-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

.header-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--card); color: var(--ink-3);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 1rem; border: 1px solid var(--line);
  transition: all .2s ease; flex-shrink: 0;
}
.header-btn:hover { color: var(--accent); border-color: var(--accent); }
.header-btn:active { transform: scale(.94); }

main { padding-top: 8px; }
.view { display: none; }
.view.active { display: block; animation: viewIn .35s cubic-bezier(.2,.9,.3,1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ═══ HERO ═══ */
.hero {
  background: linear-gradient(135deg, #5b4fe9 0%, #4f46e5 40%, #4338ca 100%);
  border-radius: 22px; padding: 22px 22px 20px;
  color: #fff; position: relative; overflow: hidden;
  box-shadow: var(--shadow-hero); margin-bottom: 14px;
}
.hero::before {
  content: ''; position: absolute;
  top: -80px; inset-inline-end: -60px;
  width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(255,255,255,.15) 0%, transparent 65%);
  border-radius: 50%; pointer-events: none;
}
.hero::after {
  content: ''; position: absolute;
  bottom: -100px; inset-inline-start: -40px;
  width: 180px; height: 180px;
  background: radial-gradient(circle, rgba(124,58,237,.35) 0%, transparent 65%);
  border-radius: 50%; pointer-events: none;
}

.hero-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; position: relative; z-index: 1; }
.hero-label { font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .78; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.16); backdrop-filter: blur(10px);
  padding: 5px 12px; border-radius: 20px;
  font-size: .7rem; font-weight: 700;
  border: 1px solid rgba(255,255,255,.1);
}
.hero-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; }

.hero-amount {
  font-size: 2.35rem; font-weight: 800;
  letter-spacing: -.03em; line-height: 1.1;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
  position: relative; z-index: 1;
  direction: ltr; unicode-bidi: isolate;
}
.hero-amount .cur { font-size: 1rem; font-weight: 600; opacity: .7; margin-inline-start: 6px; letter-spacing: 0; }

.hero-foot {
  display: flex; align-items: center; gap: 7px;
  margin-top: 14px; font-size: .8rem; font-weight: 600;
  opacity: .9; position: relative; z-index: 1;
}
.hero-foot i { font-size: .95rem; }

@media (max-width: 420px) {
  .hero { padding: 20px 18px 18px; border-radius: 20px; }
  .hero-amount { font-size: 1.95rem; }
  .hero-amount .cur { font-size: .88rem; }
}

/* ═══ STATS ═══ */
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }

.stat-pill {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 8px;
  transition: all .2s ease;
}
.stat-pill:active { transform: scale(.98); }

.stat-pill-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
}
.stat-pill-label {
  display: flex; align-items: center; gap: 7px;
  font-size: .72rem; font-weight: 600; color: var(--ink-4);
  letter-spacing: .01em;
}
.stat-pill-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.stat-pill-dot.up { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.stat-pill-dot.down { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }

.stat-pill-sym {
  width: 24px; height: 24px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: .85rem; font-weight: 800;
  flex-shrink: 0;
}
.stat-pill-sym.up { color: var(--green); background: var(--green-soft); }
.stat-pill-sym.down { color: var(--red); background: var(--red-soft); }

.stat-pill-value {
  font-size: 1.05rem; font-weight: 800;
  color: var(--ink); letter-spacing: -.025em;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
  overflow-wrap: anywhere;
}
.stat-pill-sub { font-size: .68rem; color: var(--ink-5); font-weight: 600; }

/* ═══ SECTION HEAD ═══ */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 10px; padding: 0 4px;
}
.section-title {
  font-size: .74rem; font-weight: 800; color: var(--ink-4);
  letter-spacing: .12em; text-transform: uppercase;
}
.section-action {
  font-size: .78rem; font-weight: 700; color: var(--accent);
  display: inline-flex; align-items: center; gap: 4px;
  cursor: pointer; padding: 4px 8px; border-radius: 8px;
  transition: opacity .2s;
}
.section-action:active { opacity: .6; }

/* ═══ TX LIST ═══ */
.tx-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }

.tx-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  transition: all .2s ease; cursor: pointer;
  animation: rowIn .3s cubic-bezier(.2,.9,.3,1) both;
}
.tx-row:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.tx-row:active { transform: scale(.99); }
@keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.tx-row:nth-child(1) { animation-delay: .02s; }
.tx-row:nth-child(2) { animation-delay: .06s; }
.tx-row:nth-child(3) { animation-delay: .10s; }
.tx-row:nth-child(4) { animation-delay: .14s; }
.tx-row:nth-child(5) { animation-delay: .18s; }

.tx-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.05rem; flex-shrink: 0;
}

.tx-info { flex: 1; min-width: 0; }
.tx-title {
  font-size: .92rem; font-weight: 700; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  letter-spacing: -.005em;
}
.tx-sub {
  font-size: .72rem; color: var(--ink-4); font-weight: 500;
  margin-top: 3px; display: flex; align-items: center; gap: 5px;
}
.tx-sub .dot-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-5); opacity: .5; }

.tx-amount {
  font-size: .95rem; font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
  flex-shrink: 0; white-space: nowrap;
}
.tx-amount.in { color: var(--green); }
.tx-amount.out { color: var(--ink); }

/* ═══ ANALYSIS CARD ═══ */
.analysis-card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; overflow: hidden;
  margin-bottom: 20px;
  position: relative;
}
.analysis-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 16px 18px;
  cursor: pointer; user-select: none;
}
.analysis-head:active { background: var(--card-2); }
.analysis-title {
  display: flex; align-items: center; gap: 12px;
  font-weight: 700; font-size: .92rem; color: var(--ink);
}
.analysis-icon {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--accent-soft); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0;
}
.analysis-chev {
  color: var(--ink-5); font-size: 1.1rem;
  transition: transform .3s cubic-bezier(.2,.9,.3,1);
}
.analysis-card.open .analysis-chev { transform: rotate(180deg); }
.analysis-body { max-height: 0; overflow: hidden; transition: max-height .4s cubic-bezier(.2,.9,.3,1); }
.analysis-card.open .analysis-body { max-height: 800px; }
.analysis-content { padding: 4px 18px 20px; }

.donut-row { display: flex; align-items: center; gap: 18px; padding: 8px 0 4px; }
.donut-wrap { position: relative; width: 120px; height: 120px; flex-shrink: 0; }
.donut-wrap svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
.donut-seg { fill: none; stroke-width: 14; transition: stroke-dashoffset .8s cubic-bezier(.2,.9,.3,1); }
.donut-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
}
.donut-label { font-size: .58rem; color: var(--ink-5); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.donut-value { font-size: 1rem; font-weight: 800; color: var(--ink); margin-top: 2px; letter-spacing: -.02em; }

.legend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.legend-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .82rem; }
.legend-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.legend-name { font-weight: 600; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend-value { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; font-size: .78rem; flex-shrink: 0; }

/* ═══ BUDGET ═══ */
.budget-list { display: flex; flex-direction: column; gap: 10px; }
.budget-row {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 14px 16px;
  animation: rowIn .3s cubic-bezier(.2,.9,.3,1) both;
}
.budget-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.budget-name {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: .88rem; color: var(--ink); min-width: 0;
}
.budget-icon {
  width: 32px; height: 32px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: .85rem; flex-shrink: 0;
}
.budget-figures {
  font-size: .76rem; font-weight: 700;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0; color: var(--ink-4);
}
.budget-figures strong { color: var(--ink); font-weight: 800; }

.budget-bar { height: 6px; background: var(--line); border-radius: 20px; overflow: hidden; }
.budget-fill { height: 100%; border-radius: 20px; transition: width .7s cubic-bezier(.2,.9,.3,1); }
.budget-fill.ok { background: linear-gradient(90deg, #10b981, #34d399); }
.budget-fill.warn { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.budget-fill.over { background: linear-gradient(90deg, #ef4444, #f87171); }

.budget-foot {
  display: flex; justify-content: space-between;
  margin-top: 8px; font-size: .7rem; font-weight: 600; color: var(--ink-4);
}
.budget-pct { font-weight: 800; }
.budget-pct.ok { color: var(--green); }
.budget-pct.warn { color: var(--amber); }
.budget-pct.over { color: var(--red); }

/* ═══ CHIPS ═══ */
.chips-row { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; margin-bottom: 14px; scrollbar-width: none; }
.chips-row::-webkit-scrollbar { display: none; }

.chip {
  padding: 8px 16px; border-radius: 20px;
  border: 1px solid var(--line); background: var(--card);
  color: var(--ink-4); font-weight: 600; font-size: .78rem;
  white-space: nowrap; cursor: pointer; flex-shrink: 0;
  transition: all .2s ease;
}
.chip:hover { border-color: var(--ink-5); color: var(--ink-2); }
.chip.active {
  background: linear-gradient(135deg, #5b4fe9, #4f46e5);
  border-color: transparent; color: #fff;
  font-weight: 700;
  box-shadow: 0 6px 14px -4px rgba(79,70,229,.4);
}

.search-wrap { position: relative; margin-bottom: 14px; }
.search-input {
  width: 100%; padding: 12px 42px 12px 16px;
  border-radius: 14px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink);
  font-size: .88rem; font-weight: 500; outline: none;
  transition: border-color .2s;
}
[dir="rtl"] .search-input { padding: 12px 16px 12px 42px; }
.search-input:focus { border-color: var(--accent); }
.search-wrap i {
  position: absolute; inset-inline-end: 16px; top: 50%;
  transform: translateY(-50%); color: var(--ink-5);
  font-size: .95rem; pointer-events: none;
}

/* ═══ EMPTY ═══ */
.empty { text-align: center; padding: 56px 24px; color: var(--ink-4); }
.empty-icon {
  width: 64px; height: 64px; margin: 0 auto 16px;
  border-radius: 50%; background: var(--card); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; color: var(--ink-5);
}
.empty p { font-size: .88rem; font-weight: 600; color: var(--ink-4); }

/* ═══ BOTTOM NAV ═══ */
.bottom-nav {
  position: fixed; bottom: 0; inset-inline: 0; z-index: 40;
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  border-top: 1px solid var(--line);
  padding: 6px 0 max(6px, env(safe-area-inset-bottom));
}
.nav-inner { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 480px; margin: 0 auto; padding: 0 12px; }
.nav-btn {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 10px 4px 12px; border-radius: 10px;
  color: var(--ink-5); font-size: .66rem; font-weight: 600;
  transition: all .2s ease; cursor: pointer; background: none; border: none;
}
.nav-btn i { font-size: 1.25rem; transition: transform .25s cubic-bezier(.2,.9,.3,1); }
.nav-btn.active { color: var(--accent); font-weight: 800; }
.nav-btn.active i { transform: translateY(-1px) scale(1.08); }
.nav-btn:active { transform: scale(.94); }

.nav-btn .nav-indicator {
  position: absolute;
  top: 0;
  inset-inline-start: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 3px;
  background: linear-gradient(90deg, #5b4fe9, #7c3aed);
  border-radius: 0 0 3px 3px;
  transition: width .3s cubic-bezier(.2,.9,.3,1);
}
.nav-btn.active .nav-indicator { width: 28px; }

/* ═══ FAB ═══ */
.fab {
  position: fixed; bottom: 96px; inset-inline-end: 24px;
  width: 58px; height: 58px; border-radius: 50%;
  background: linear-gradient(140deg, #5b4fe9, #4338ca);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem;
  box-shadow: var(--shadow-fab);
  z-index: 45; transition: all .25s cubic-bezier(.2,.9,.3,1);
  cursor: pointer; border: none;
}
.fab:hover { transform: scale(1.08); }
.fab:active { transform: scale(.92); }

/* ═══ MODAL ═══ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(15,23,41,.5); z-index: 1000;
  display: none; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.modal-overlay.active { display: flex; animation: overlayIn .25s ease; }
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

.modal-sheet {
  background: var(--card);
  border-radius: 26px 26px 0 0;
  width: 100%; max-width: 480px; max-height: 92vh;
  overflow-y: auto;
  animation: sheetIn .35s cubic-bezier(.2,.9,.3,1);
  padding-bottom: max(20px, env(safe-area-inset-bottom));
}
@keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }

@media (min-width: 520px) {
  .modal-overlay { align-items: center; padding: 20px; }
  .modal-sheet { border-radius: 24px; max-height: 88vh; }
  @keyframes sheetIn { from { opacity: 0; transform: scale(.96) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
}

.sheet-handle { width: 40px; height: 4px; background: var(--line-2); border-radius: 20px; margin: 10px auto 4px; }
@media (min-width: 520px) { .sheet-handle { display: none; } }

.sheet-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 16px 22px 14px;
}
.sheet-title { font-size: 1rem; font-weight: 700; color: var(--ink); }
.sheet-close {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--card-2); color: var(--ink-4);
  display: flex; align-items: center; justify-content: center;
  font-size: .9rem; transition: all .2s;
}
.sheet-close:hover { color: var(--ink); background: var(--line); }
.sheet-close:active { transform: scale(.9); }

.sheet-body { padding: 4px 22px 8px; }
@media (max-width: 400px) { .sheet-body { padding: 4px 18px 8px; } .sheet-head { padding: 16px 18px 12px; } }

/* ═══ TYPE TOGGLE ═══ */
.type-toggle {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  background: var(--card-2); padding: 4px;
  border-radius: 14px; margin-bottom: 22px; border: 1px solid var(--line);
}
.type-btn {
  padding: 10px; border-radius: 11px;
  font-weight: 700; font-size: .84rem; color: var(--ink-4);
  transition: all .25s ease;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; background: transparent; border: none;
}
.type-btn.active.expense { background: var(--card); color: var(--red); box-shadow: var(--shadow-xs); }
.type-btn.active.income { background: var(--card); color: var(--green); box-shadow: var(--shadow-xs); }
[data-theme="dark"] .type-btn.active.expense { color: #fca5a5; }
[data-theme="dark"] .type-btn.active.income { color: #6ee7b7; }

/* ═══ AMOUNT ═══ */
.amount-wrap { text-align: center; margin-bottom: 24px; }
.amount-label {
  font-size: .68rem; font-weight: 700; color: var(--ink-5);
  letter-spacing: .08em; text-transform: uppercase;
  display: block; margin-bottom: 10px;
}
.amount-input {
  width: 100%; border: none; outline: none; background: transparent;
  text-align: center; font-size: 2.6rem; font-weight: 800;
  color: var(--ink); letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
  padding: 4px; line-height: 1;
  direction: ltr;
}
.amount-input::placeholder { color: var(--ink-5); opacity: .3; }
.amount-cursor {
  width: 60px; height: 3px; background: var(--line-2);
  border-radius: 20px; margin: 12px auto 0; transition: all .25s;
}
.amount-wrap.focused .amount-cursor { background: var(--accent); width: 80px; }
@media (max-width: 400px) { .amount-input { font-size: 2.1rem; } }

/* ═══ CATEGORIES ═══ */
.field-label {
  font-size: .68rem; font-weight: 700; color: var(--ink-5);
  letter-spacing: .08em; text-transform: uppercase;
  display: block; margin-bottom: 10px;
}
.cat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; }
@media (max-width: 400px) { .cat-grid { grid-template-columns: repeat(4, 1fr); } }

.cat-item {
  padding: 10px 4px; border-radius: 12px;
  border: 1.5px solid transparent; background: var(--card-2);
  cursor: pointer; transition: all .2s cubic-bezier(.2,.9,.3,1);
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  min-height: 68px; font-family: inherit;
}
.cat-item:hover { transform: translateY(-1px); }
.cat-item:active { transform: scale(.96); }
.cat-item.active { border-color: var(--accent); background: var(--accent-soft); }
[data-theme="dark"] .cat-item.active { background: rgba(91,79,233,.2); }
.cat-icon {
  width: 30px; height: 30px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: .85rem; flex-shrink: 0;
}
.cat-item.active .cat-icon { transform: scale(1.05); }
.cat-name {
  font-size: .63rem; font-weight: 700; text-align: center; line-height: 1.1;
  color: var(--ink-4); max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cat-item.active .cat-name { color: var(--accent); }

/* ═══ FORM ═══ */
.field { margin-bottom: 16px; }
.input {
  width: 100%; padding: 12px 16px;
  border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--card-2); color: var(--ink);
  font-size: .9rem; font-weight: 500; outline: none;
  transition: all .2s;
}
.input:hover { border-color: var(--line-2); }
.input:focus { border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 3px rgba(91,79,233,.1); }
.input::placeholder { color: var(--ink-5); }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ═══ BUTTONS ═══ */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; padding: 13px 22px; border-radius: 12px;
  font-weight: 700; font-size: .9rem; cursor: pointer;
  transition: all .2s ease; border: none; font-family: inherit;
  white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn-primary {
  background: linear-gradient(135deg, #5b4fe9, #4338ca);
  color: #fff; box-shadow: 0 8px 20px -6px rgba(79,70,229,.45);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -6px rgba(79,70,229,.55); }
.btn-ghost { background: var(--card-2); color: var(--ink-2); border: 1px solid var(--line); }
.btn-ghost:hover { background: var(--card); border-color: var(--ink-5); }
.btn-block { width: 100%; }

/* ═══ SETTINGS ═══ */
.settings-group {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; overflow: hidden; margin-bottom: 14px;
}
.setting-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; cursor: pointer;
  transition: background .15s;
  border-bottom: 1px solid var(--line);
  font-family: inherit; color: var(--ink);
  text-align: start; width: 100%;
  background: none; border-inline: none; border-top: none;
}
.setting-row:last-child { border-bottom: none; }
.setting-row:hover { background: var(--card-2); }
.setting-icon {
  width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: .9rem; flex-shrink: 0;
}
.setting-body { flex: 1; min-width: 0; }
.setting-title { font-size: .88rem; font-weight: 700; color: var(--ink); }
.setting-sub { font-size: .7rem; color: var(--ink-5); font-weight: 500; margin-top: 2px; }
.setting-chev { color: var(--ink-5); font-size: .85rem; }
.setting-row.danger .setting-title { color: var(--red); }
.setting-row.danger:hover { background: var(--red-soft); }

/* ═══ TOAST ═══ */
.toast {
  position: fixed; bottom: 100px; inset-inline-start: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--ink); color: var(--bg);
  padding: 12px 20px; border-radius: 14px;
  display: flex; align-items: center; gap: 10px;
  font-weight: 600; font-size: .84rem;
  box-shadow: 0 20px 40px -10px rgba(0,0,0,.35);
  z-index: 200; opacity: 0; pointer-events: none;
  transition: all .35s cubic-bezier(.2,.9,.3,1);
  max-width: calc(100vw - 40px);
}
[data-theme="dark"] .toast { background: var(--card); color: var(--ink); border: 1px solid var(--line-2); }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
.toast i { font-size: 1.05rem; flex-shrink: 0; }
.toast.success i { color: #34d399; }
[data-theme="dark"] .toast.success i { color: var(--green); }
.toast.error i { color: #f87171; }

@media print {
  .bottom-nav, .fab, .app-header { display: none !important; }
  body { padding: 0; background: #fff; }
  .view { display: block !important; }

    history: 'Historique', filterAll: 'Tout', filterIncome: 'Revenus', filterExpense: 'Dépenses',
    settings: 'Réglages',
    language: 'Langue', currency: 'Devise', theme: 'Thème',
    backup: 'Sauvegarde', backupSub: 'JSON — toutes les données',
    csv: 'Export CSV', csvSub: 'Pour Excel',
    restore: 'Importer', restoreSub: 'Depuis une sauvegarde',

    navHome: 'Accueil', navBudget: 'Budget', navHistory: 'Historique', navSettings: 'Réglages',

    expense: 'Dépense', incomeL: 'Revenu',
    today: 'Aujourd\'hui', yesterday: 'Hier',
    noTx: 'Aucune transaction', noTxMonth: 'Aucune transaction ce mois',
    noBudget: 'Aucun budget défini',
    budgetHint: 'Fixez un plafond mensuel par catégorie. Laissez vide pour ignorer.',
    editBudgets: 'Modifier les budgets',
    remaining: 'Restant', exceeded: 'Dépassé',
    deleteConfirm: 'Supprimer cette transaction ?', resetConfirm: 'Tout supprimer ?',
    saved: 'Enregistrée', deleted: 'Supprimée',
    imported: 'Importé', importError: 'Erreur',
    fillFields: 'Entrez montant + catégorie',
    currencyChanged: 'Devise modifiée',
    monthNames: ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'],
    leftover: 'Économisé', overspent: 'Dépassement',
    operations: 'op.'
  }
};

let state = {
  lang: 'ar', theme: 'light', currency: 'MAD',
  transactions: [], budgets: {},
  year: new Date().getFullYear(), month: new Date().getMonth(),
  filter: 'all', editingId: null, selType: 'expense', selCat: 'food'
};
let db = null;

/* ═══════════════════════════════════════════════════════
   DB
═══════════════════════════════════════════════════════ */
function initDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_TX)) d.createObjectStore(STORE_TX, { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains(STORE_SETTINGS)) d.createObjectStore(STORE_SETTINGS, { keyPath: 'key' });
    };
    r.onsuccess = e => { db = e.target.result; res(); };
    r.onerror = e => rej(e);
  });
}
const dbAll = s => new Promise(r => { const tx = db.transaction(s, 'readonly'); const q = tx.objectStore(s).getAll(); tx.oncomplete = () => r(q.result || []); });
const dbGet = (s, k) => new Promise(r => { const tx = db.transaction(s, 'readonly'); const q = tx.objectStore(s).get(k); tx.oncomplete = () => r(q.result); });
const dbPut = (s, d) => new Promise(r => { const tx = db.transaction(s, 'readwrite'); tx.objectStore(s).put(d); tx.oncomplete = () => r(); });
const dbAdd = (s, d) => new Promise(r => { const tx = db.transaction(s, 'readwrite'); const q = tx.objectStore(s).add(d); tx.oncomplete = () => r(q.result); });
const dbDel = (s, k) => new Promise(r => { const tx = db.transaction(s, 'readwrite'); tx.objectStore(s).delete(k); tx.oncomplete = () => r(); });
const dbClear = s => new Promise(r => { const tx = db.transaction(s, 'readwrite'); tx.objectStore(s).clear(); tx.oncomplete = () => r(); });

/* ═══════════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════════ */
const t = k => (I18N[state.lang] && I18N[state.lang][k]) || k;

/* No thousands separator — just a plain number */
function fmtRaw(n) {
  const num = Number(n) || 0;
  const abs = Math.abs(num);
  const str = abs.toFixed(2);
  return (num < 0 ? MINUS : '') + str;
}

function fmt(n, withCur = true) {
  const str = fmtRaw(n);
  if (!withCur) return LRI + str + PDI;
  const sym = (CURRENCIES[state.currency] && CURRENCIES[state.currency].symbol) || state.currency;
  return LRI + str + NBSP + sym + PDI;
}

function fmtShort(n) {
  const num = Number(n) || 0;
  const a = Math.abs(num);
  let s;
  if (a >= 1000000) s = (num / 1000000).toFixed(1) + 'M';
  else if (a >= 1000) s = (num / 1000).toFixed(1) + 'k';
  else s = num.toFixed(0);
  return LRI + s + PDI;
}

const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const catInfo = (type, id) => {
  const found = (CATEGORIES[type] || []).find(c => c.id === id);
  return found || { id, icon: 'bi-tag', ar: id, fr: id, color: '#64748b', bg: '#e2e8f0', dark: '#334155' };
};

function dateLabel(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = new Date(y, m - 1, d);
  const diff = Math.round((today - target) / 86400000);
  if (diff === 0) return t('today');
  if (diff === 1) return t('yesterday');
  const dayStr = LRI + d + PDI;
  return `${dayStr} ${(t('monthNames') || [])[m - 1] || ''}`;
}

/* ═══════════════════════════════════════════════════════
   SETTINGS
═══════════════════════════════════════════════════════ */
function loadLocal() {
  try {
    const l = localStorage.getItem('mb_lang'); if (l === 'fr' || l === 'ar') state.lang = l;
    const th = localStorage.getItem('mb_theme'); if (th === 'dark' || th === 'light') state.theme = th;
    const c = localStorage.getItem('mb_currency'); if (c && CURRENCIES[c]) state.currency = c;
  } catch(e) {}
}
function saveLocal() {
  try {
    localStorage.setItem('mb_lang', state.lang);
    localStorage.setItem('mb_theme', state.theme);
    localStorage.setItem('mb_currency', state.currency);
  } catch(e) {}
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  const i = document.getElementById('themeIcon');
  if (i) i.className = state.theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
  const sub = document.getElementById('themeSub');
  if (sub) sub.textContent = state.theme === 'dark' ? (state.lang === 'ar' ? 'داكن' : 'Sombre') : (state.lang === 'ar' ? 'فاتح' : 'Clair');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', state.theme === 'dark' ? '#0a0e1e' : '#5b4fe9');
}
function toggleTheme() { state.theme = state.theme === 'dark' ? 'light' : 'dark'; saveLocal(); applyTheme(); }

function toggleLanguage() { state.lang = state.lang === 'ar' ? 'fr' : 'ar'; saveLocal(); applyLang(); renderAll(); }

function applyLang() {
  const root = document.getElementById('html-root');
  root.setAttribute('lang', state.lang);
  root.setAttribute('dir', state.lang === 'ar' ? 'rtl' : 'ltr');

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.getAttribute('data-i18n'));
    if (typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const v = t(el.getAttribute('data-i18n-ph'));
    if (typeof v === 'string') el.placeholder = v;
  });

  const l = document.getElementById('langSub'); if (l) l.textContent = state.lang === 'ar' ? 'العربية' : 'Français';
  const c = document.getElementById('curSub'); if (c) c.textContent = state.currency;

  const chev = document.getElementById('seeAllChev');
  if (chev) chev.className = state.lang === 'ar' ? 'bi bi-chevron-left' : 'bi bi-chevron-right';

  // Arrows flip with language
  const cp = document.getElementById('chevPrev');
  const cn = document.getElementById('chevNext');
  if (cp && cn) {
    // In RTL: right arrow = previous, left arrow = next
    // In LTR: left arrow = previous, right arrow = next
    cp.className = state.lang === 'ar' ? 'bi bi-chevron-right' : 'bi bi-chevron-left';
    cn.className = state.lang === 'ar' ? 'bi bi-chevron-left' : 'bi bi-chevron-right';
  }
}

function switchView(n) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + n)?.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === n));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function shiftMonth(d) {
  let m = state.month + d, y = state.year;
  while (m < 0) { m += 12; y--; }
  while (m > 11) { m -= 12; y++; }
  state.month = m; state.year = y;
  renderAll();
}
function jumpToCurrentMonth() {
  const n = new Date();
  state.year = n.getFullYear(); state.month = n.getMonth();
  renderAll();
}
function monthTx() {
  const p = `${state.year}-${String(state.month + 1).padStart(2, '0')}`;
  return state.transactions.filter(x => x.date && x.date.startsWith(p));
}

/* ═══════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════ */
function renderAll() {
  renderHeader();
  renderDashboard();
  renderBudget();
  renderHistory();
  applyTheme();
  applyLang();
}

function renderHeader() {
  const months = t('monthNames') || [];
  document.getElementById('monthTitle').textContent = `${months[state.month] || ''}`;
  document.getElementById('monthYear').textContent = LRI + state.year + PDI;
  const count = monthTx().length;
  document.getElementById('monthSub').textContent = LRI + count + PDI + ' ' + t('operations');
}

function renderDashboard() {
  const tx = monthTx();
  const inc = tx.filter(x => x.type === 'income');
  const exp = tx.filter(x => x.type === 'expense');

  const totalInc = inc.reduce((s, x) => s + x.amount, 0);
  const totalExp = exp.reduce((s, x) => s + x.amount, 0);
  const balance = totalInc - totalExp;

  const sym = CURRENCIES[state.currency].symbol;
  const balEl = document.getElementById('heroAmount');
  const rawBal = fmtRaw(balance);
  balEl.innerHTML = LRI + esc(rawBal) + NBSP + '<span class="cur">' + esc(sym) + '</span>' + PDI;

  const foot = document.getElementById('heroFoot');
  if (balance >= 0) {
    foot.innerHTML = '<i class="bi bi-check-circle-fill"></i><span>' + esc(t('leftover')) + ' ' + LRI + esc(fmtRaw(balance)) + NBSP + esc(sym) + PDI + '</span>';
  } else {
    foot.innerHTML = '<i class="bi bi-exclamation-triangle-fill"></i><span>' + esc(t('overspent')) + ' ' + LRI + esc(fmtRaw(Math.abs(balance))) + NBSP + esc(sym) + PDI + '</span>';
  }

  document.getElementById('statIncome').textContent = fmt(totalInc);
  document.getElementById('statExpense').textContent = fmt(totalExp);
  document.getElementById('statIncomeSub').textContent = LRI + inc.length + PDI + ' ' + t('operations');
  document.getElementById('statExpenseSub').textContent = LRI + exp.length + PDI + ' ' + t('operations');

  const recent = [...tx].sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.id - a.id).slice(0, 4);
  const list = document.getElementById('recentList');
  if (recent.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon"><i class="bi bi-inbox"></i></div><p>${t('noTxMonth')}</p></div>`;
  } else {
    list.innerHTML = recent.map(renderRow).join('');
  }

  renderDonut(exp);
}

function renderRow(x) {
  const info = catInfo(x.type, x.category);
  const name = state.lang === 'ar' ? info.ar : info.fr;
  const isInc = x.type === 'income';
  const sign = isInc ? '+' : MINUS;
  const cls = isInc ? 'in' : 'out';
  const amtStr = LRI + sign + esc(fmtRaw(x.amount)) + PDI;

  return `<div class="tx-row" onclick="openEdit(${x.id})">
    <div class="tx-avatar" style="background:${info.bg}; color:${info.dark};">
      <i class="bi ${info.icon}"></i>
    </div>
    <div class="tx-info">
      <div class="tx-title">${esc(name)}</div>
      <div class="tx-sub">
        <span>${dateLabel(x.date)}</span>
        ${x.note ? `<span class="dot-sep"></span><span>${esc(x.note)}</span>` : ''}
      </div>
    </div>
    <div class="tx-amount ${cls}">${amtStr}</div>
  </div>`;
}

function renderDonut(exp) {
  const total = exp.reduce((s, x) => s + x.amount, 0);
  const segs = document.getElementById('donutSegs');
  const legend = document.getElementById('donutLegend');

  document.getElementById('donutTotal').textContent = fmtShort(total);

  if (total === 0) {
    segs.innerHTML = '';
    legend.innerHTML = `<div style="font-size:.8rem; color:var(--ink-5); text-align:center; padding:20px 0; font-weight:600;">${t('noTxMonth')}</div>`;
    return;
  }

  const byCat = {};
  exp.forEach(x => { byCat[x.category] = (byCat[x.category] || 0) + x.amount; });

  const items = Object.entries(byCat)
    .map(([id, amt]) => ({ id, amt, info: catInfo('expense', id) }))
    .sort((a, b) => b.amt - a.amt)
    .slice(0, 5);

  const r = 48, circ = 2 * Math.PI * r;
  let offset = 0, html = '';

  items.forEach(it => {
    const pct = it.amt / total;
    const dash = pct * circ;
    const gap = circ - dash;
    html += `<circle class="donut-seg" cx="60" cy="60" r="${r}" stroke="${it.info.color}"
      stroke-dasharray="${dash.toFixed(3)} ${gap.toFixed(3)}" stroke-dashoffset="${(-offset).toFixed(3)}"></circle>`;
    offset += dash;
  });

  segs.innerHTML = html;

  legend.innerHTML = items.map(it => {
    const name = state.lang === 'ar' ? it.info.ar : it.info.fr;
    const pct = ((it.amt / total) * 100).toFixed(0);
    return `<div class="legend-item">
      <div class="legend-left">
        <span class="legend-dot" style="background:${it.info.color};"></span>
        <span class="legend-name">${esc(name)}</span>
      </div>
      <div class="legend-value">${LRI}${pct}%${PDI}</div>
    </div>`;
  }).join('');
}

function toggleAnalysis() {
  document.getElementById('analysisExpander').classList.toggle('open');
}

function renderBudget() {
  const list = document.getElementById('budgetList');
  const tx = monthTx();
  const exp = tx.filter(x => x.type === 'expense');

  const byCat = {};
  exp.forEach(x => { byCat[x.category] = (byCat[x.category] || 0) + x.amount; });

  const items = CATEGORIES.expense
    .filter(c => state.budgets[c.id] && state.budgets[c.id] > 0)
    .map(c => ({ info: c, limit: state.budgets[c.id], spent: byCat[c.id] || 0 }));

  if (items.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon"><i class="bi bi-bullseye"></i></div><p>${t('noBudget')}</p></div>`;
    return;
  }

  list.innerHTML = items.map(it => {
    const pct = it.limit > 0 ? (it.spent / it.limit) * 100 : 0;
    const w = Math.min(100, pct);
    const cls = pct >= 100 ? 'over' : pct >= 75 ? 'warn' : 'ok';
    const name = state.lang === 'ar' ? it.info.ar : it.info.fr;
    const rem = it.limit - it.spent;
    const remTxt = rem >= 0
      ? esc(t('remaining')) + ' ' + LRI + esc(fmtRaw(rem)) + PDI
      : esc(t('exceeded')) + ' ' + LRI + esc(fmtRaw(Math.abs(rem))) + PDI;

    return `<div class="budget-row">
      <div class="budget-head">
        <div class="budget-name">
          <div class="budget-icon" style="background:${it.info.bg}; color:${it.info.dark};">
            <i class="bi ${it.info.icon}"></i>
          </div>
          <span>${esc(name)}</span>
        </div>
        <div class="budget-figures">
          <strong>${esc(fmtRaw(it.spent))}</strong> / ${esc(fmtRaw(it.limit))}
        </div>
      </div>
      <div class="budget-bar"><div class="budget-fill ${cls}" style="width:${w}%;"></div></div>
      <div class="budget-foot">
        <span>${remTxt}</span>
        <span class="budget-pct ${cls}">${LRI}${pct.toFixed(0)}%${PDI}</span>
      </div>
    </div>`;
  }).join('');
}

function renderHistory() {
  const list = document.getElementById('historyList');
  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();

  let tx = [...monthTx()];
  if (state.filter !== 'all') tx = tx.filter(x => x.type === state.filter);
  if (q) tx = tx.filter(x => {
    const info = catInfo(x.type, x.category);
    const name = (state.lang === 'ar' ? info.ar : info.fr).toLowerCase();
    return name.includes(q) || (x.note || '').toLowerCase().includes(q) || String(x.amount).includes(q);
  });

  tx.sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.id - a.id);

  if (tx.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon"><i class="bi bi-inbox"></i></div><p>${t('noTxMonth')}</p></div>`;
    return;
  }
  list.innerHTML = tx.map(renderRow).join('');
}

function setFilter(f) {
  state.filter = f;
  document.querySelectorAll('.chip[data-filter]').forEach(c => c.classList.toggle('active', c.dataset.filter === f));
  renderHistory();
}

/* ═══════════════════════════════════════════════════════
   ADD / EDIT
═══════════════════════════════════════════════════════ */
function openAddSheet() {
  state.editingId = null;
  state.selType = 'expense';
  state.selCat = 'food';
  document.getElementById('sheetTitle').textContent = t('newTx');
  document.getElementById('amountInput').value = '';
  document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
  document.getElementById('noteInput').value = '';
  document.getElementById('deleteBtn').style.display = 'none';
  updateTypeBtns();
  renderCatGrid();
  openModal('addModal');
  setTimeout(() => { try { document.getElementById('amountInput').focus(); } catch(e){} }, 350);
}

function openEdit(id) {
  const x = state.transactions.find(t => t.id === id);
  if (!x) return;
  state.editingId = id;
  state.selType = x.type;
  state.selCat = x.category;
  document.getElementById('sheetTitle').textContent = t('editTx');
  document.getElementById('amountInput').value = x.amount;
  document.getElementById('dateInput').value = x.date;
  document.getElementById('noteInput').value = x.note || '';
  document.getElementById('deleteBtn').style.display = '';
  updateTypeBtns();
  renderCatGrid();
  openModal('addModal');
}

function selectTxType(type) {
  state.selType = type;
  state.selCat = CATEGORIES[type][0].id;
  updateTypeBtns();
  renderCatGrid();
}

function updateTypeBtns() {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === state.selType));
}

function renderCatGrid() {
  const g = document.getElementById('catGrid');
  g.innerHTML = (CATEGORIES[state.selType] || []).map(c => {
    const name = state.lang === 'ar' ? c.ar : c.fr;
    const active = state.selCat === c.id ? 'active' : '';
    return `<button type="button" class="cat-item ${active}" data-cat="${c.id}" onclick="selectCat('${c.id}')">
      <div class="cat-icon" style="background:${c.bg}; color:${c.dark};">
        <i class="bi ${c.icon}"></i>
      </div>
      <div class="cat-name">${esc(name)}</div>
    </button>`;
  }).join('');
}

function selectCat(id) {
  state.selCat = id;
  document.querySelectorAll('.cat-item').forEach(b => b.classList.toggle('active', b.dataset.cat === id));
}

async function saveTransaction() {
  const amt = parseFloat(document.getElementById('amountInput').value);
  const date = document.getElementById('dateInput').value;
  const note = document.getElementById('noteInput').value.trim();

  if (!amt || amt <= 0 || !date) { showToast(t('fillFields'), 'error'); return; }

  const p = { type: state.selType, category: state.selCat, amount: amt, date, note, updatedAt: Date.now() };

  if (state.editingId) { p.id = state.editingId; await dbPut(STORE_TX, p); }
  else { p.createdAt = Date.now(); await dbAdd(STORE_TX, p); }

  await loadTx();
  renderAll();
  closeModal('addModal');
  showToast(t('saved'), 'success');
}

async function deleteCurrentTx() {
  if (!state.editingId) return;
  const r = await Swal.fire({
    icon: 'warning', title: t('deleteConfirm'),
    showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#6b7280',
    confirmButtonText: state.lang === 'ar' ? 'حذف' : 'Supprimer',
    cancelButtonText: state.lang === 'ar' ? 'إلغاء' : 'Annuler'
  });
  if (!r.isConfirmed) return;
  await dbDel(STORE_TX, state.editingId);
  await loadTx();
  renderAll();
  closeModal('addModal');
  showToast(t('deleted'), 'success');
}

/* ═══════════════════════════════════════════════════════
   BUDGET EDITOR
═══════════════════════════════════════════════════════ */
function openBudgetEditor() {
  const box = document.getElementById('budgetInputs');
  box.innerHTML = CATEGORIES.expense.map(c => {
    const name = state.lang === 'ar' ? c.ar : c.fr;
    const v = state.budgets[c.id] || '';
    return `<div style="display:flex; align-items:center; gap:12px;">
      <div class="budget-icon" style="background:${c.bg}; color:${c.dark}; flex-shrink:0;">
        <i class="bi ${c.icon}"></i>
      </div>
      <div style="flex:1; min-width:0; font-weight:600; font-size:.86rem;">${esc(name)}</div>
      <input type="number" min="0" step="10" class="input" data-cat="${c.id}"
        value="${v}" placeholder="0"
        style="width:110px; flex-shrink:0; padding:9px 12px; text-align:center; font-weight:700; direction:ltr;">
    </div>`;
  }).join('');
  openModal('budgetModal');
}

async function saveBudgets() {
  const nb = {};
  document.querySelectorAll('#budgetInputs input[data-cat]').forEach(i => {
    const v = parseFloat(i.value);
    if (v > 0) nb[i.dataset.cat] = v;
  });
  state.budgets = nb;
  await dbPut(STORE_SETTINGS, { key: 'budgets', value: nb });
  renderAll();
  closeModal('budgetModal');
  showToast(t('saved'), 'success');
}

/* ═══════════════════════════════════════════════════════
   CURRENCY
═══════════════════════════════════════════════════════ */
function openCurrencyPicker() {
  const l = document.getElementById('currencyList');
  l.innerHTML = Object.entries(CURRENCIES).map(([code, info]) => {
    const name = state.lang === 'ar' ? info.ar : info.fr;
    const act = state.currency === code;
    return `<button class="setting-row" style="${act ? 'background:var(--accent-soft);' : ''}" onclick="selectCurrency('${code}')">
      <div class="setting-icon" style="background:var(--accent-soft); color:var(--accent); font-weight:800; font-size:.8rem;">${LRI}${esc(info.symbol)}${PDI}</div>
      <div class="setting-body">
        <div class="setting-title">${LRI}${esc(code)}${PDI}</div>
        <div class="setting-sub">${esc(name)}</div>
      </div>
      ${act ? '<i class="bi bi-check-circle-fill" style="color:var(--accent);"></i>' : ''}
    </button>`;
  }).join('');
  openModal('currencyModal');
}

function selectCurrency(code) {
  if (!CURRENCIES[code]) return;
  state.currency = code;
  saveLocal();
  renderAll();
  closeModal('currencyModal');
  showToast(t('currencyChanged'), 'success');
}

/* ═══════════════════════════════════════════════════════
   MODALS
═══════════════════════════════════════════════════════ */
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('active'); });
});

/* ═══════════════════════════════════════════════════════
   EXPORT / IMPORT / RESET
═══════════════════════════════════════════════════════ */
async function exportJSON() {
  const all = await dbAll(STORE_TX);
  const payload = { transactions: all, budgets: state.budgets, currency: state.currency, version: 1, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `budget_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  showToast(state.lang === 'ar' ? 'تم التصدير' : 'Exporté', 'success');
}

async function exportCSV() {
  const all = await dbAll(STORE_TX);
  const h = ['Date', 'Type', 'Category', 'Amount', 'Note'];
  const rows = all.map(x => [
    x.date, x.type,
    (state.lang === 'ar' ? catInfo(x.type, x.category).ar : catInfo(x.type, x.category).fr),
    x.amount, (x.note || '').replace(/[\r\n]+/g, ' ')
  ]);
  const csv = '\uFEFF' + [h, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `budget_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  showToast(state.lang === 'ar' ? 'تم التصدير' : 'Exporté', 'success');
}

function importJSON(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.transactions) throw new Error('Invalid');
      await dbClear(STORE_TX);
      for (const x of data.transactions) { const c = { ...x }; delete c.id; await dbAdd(STORE_TX, c); }
      if (data.budgets) { state.budgets = data.budgets; await dbPut(STORE_SETTINGS, { key: 'budgets', value: data.budgets }); }
      if (data.currency && CURRENCIES[data.currency]) { state.currency = data.currency; saveLocal(); }
      await loadTx();
      renderAll();
      showToast(t('imported'), 'success');
    } catch (err) {
      Swal.fire({ icon: 'error', title: t('importError'), text: err.message });
    }
  };
  r.readAsText(f);
  e.target.value = '';
}

async function resetAll() {
  const r = await Swal.fire({
    icon: 'warning', title: t('resetConfirm'),
    showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#6b7280',
    confirmButtonText: state.lang === 'ar' ? 'حذف' : 'Supprimer',
    cancelButtonText: state.lang === 'ar' ? 'إلغاء' : 'Annuler'
  });
  if (!r.isConfirmed) return;
  await dbClear(STORE_TX);
  await dbClear(STORE_SETTINGS);
  state.transactions = [];
  state.budgets = {};
  renderAll();
  showToast(t('deleted'), 'success');
}

/* ═══════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════ */
function showToast(msg, type = 'success') {
  const el = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  el.className = 'toast show ' + type;
  el.querySelector('i').className = type === 'success' ? 'bi bi-check-circle-fill' : 'bi bi-exclamation-circle-fill';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ═══════════════════════════════════════════════════════
   FOCUS / KEYBOARD
═══════════════════════════════════════════════════════ */
document.addEventListener('focusin', e => {
  if (e.target?.id === 'amountInput') document.getElementById('amountWrap').classList.add('focused');
});
document.addEventListener('focusout', e => {
  if (e.target?.id === 'amountInput') document.getElementById('amountWrap').classList.remove('focused');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
  if (e.key === 'Enter' && document.getElementById('addModal').classList.contains('active')) {
    if (document.activeElement?.id === 'amountInput') { e.preventDefault(); saveTransaction(); }
  }
});

/* ═══════════════════════════════════════════════════════
   LOAD
═══════════════════════════════════════════════════════ */
async function loadTx() { state.transactions = await dbAll(STORE_TX); }
async function loadBudgets() {
  try {
    const r = await dbGet(STORE_SETTINGS, 'budgets');
    state.budgets = (r && r.value) ? r.value : {};
  } catch(e) { state.budgets = {}; }
}

/* ═══════════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════════ */
async function boot() {
  try {
    loadLocal();
    await initDB();
    await loadTx();
    await loadBudgets();
    const n = new Date();
    state.year = n.getFullYear();
    state.month = n.getMonth();
    applyTheme();
    applyLang();
    renderAll();
  } catch (err) {
    console.error('Boot error:', err);
    document.body.innerHTML = `<div style="padding:40px; text-align:center; font-family:sans-serif;">
      <h2 style="color:#ef4444;">Erreur de chargement</h2>
      <p style="color:#666;">${err.message}</p>
    </div>`;
  }
}

window.addEventListener('error', e => console.error('❌', e.message, 'line', e.lineno));
boot();
</script>

    });
  });
}
